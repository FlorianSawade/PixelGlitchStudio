name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            architecture: arm64
          - os: macos-15-intel
            platform: macos-x86_64
            architecture: x86_64
          - os: windows-2022
            platform: windows-x86_64
            architecture: AMD64
          - os: ubuntu-22.04
            platform: linux-x86_64
            architecture: x86_64
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check architecture and version tag
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, platform
          from pixelglitch import __version__
          assert platform.machine() == os.environ['EXPECTED_ARCH'], platform.machine()
          if os.environ['REF_TYPE'] == 'tag':
              expected = f'v{__version__}'
              assert os.environ['REF_NAME'] == expected, f'Tag must be {expected}'
          print(f'PixelGlitch Studio {__version__}: {platform.platform()} / {platform.machine()}')
          PY
      - name: Test engine
        run: python test_engine.py
      - name: Test GUI
        run: python test_gui.py
      - name: Test UI features
        run: python test_ui_features.py
      - name: Install build tools
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: python -m pip install 'pyinstaller>=6.16,<7'
      - name: Build app
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          python build_app.py
          python -m pip freeze > build/dependencies.txt
      - name: Package app
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: python .github/scripts/package_app.py --platform "$PACKAGE_PLATFORM"
      - name: Upload app package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: PixelGlitchStudio-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Prepare release draft
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: PixelGlitchStudio-*
          path: packages
          merge-multiple: true
      - name: Include matching project source
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="PixelGlitchStudio-${TAG_NAME}/" -o "packages/PixelGlitchStudio-${TAG_NAME}-source.tar.gz" HEAD
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --json isDraft > release-state.json; then
            python -c "import json; assert json.load(open('release-state.json'))['isDraft'], 'Refusing to replace a published release'"
          else
            gh release create "$TAG_NAME" --verify-tag --draft --title "PixelGlitch Studio ${TAG_NAME#v}" --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$TAG_NAME" packages/* --clobber
