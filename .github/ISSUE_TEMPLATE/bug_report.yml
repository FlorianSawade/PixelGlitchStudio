name: Fehler melden
description: Ein Problem beim Start, Bearbeiten, Speichern oder Exportieren beschreiben.
title: "[Fehler] "
body:
  - type: markdown
    attributes:
      value: "Danke für deinen Bericht. Sicherheitslücken bitte [privat melden](https://github.com/FlorianSawade/PixelGlitchStudio/security/advisories/new)."
  - type: input
    id: version
    attributes:
      label: App-Version
      description: Im Menü Hilfe → Über PixelGlitch Studio zu finden; bei Quellcode bitte auch den Commit angeben.
      placeholder: "2.9.1"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Betriebssystem und Prozessor
      placeholder: "macOS 15 / Apple Silicon, Windows 11 / x86_64 oder Ubuntu 24.04 / x86_64"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Wie startest du die App?
      options:
        - Fertiges App-Paket aus einer Release
        - Aus dem Quellcode mit Python
        - Selbst gebautes App-Paket
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachvollziehen
      description: Bei Bildproblemen bitte auch Bildgröße, Effekte und relevante Parameter nennen.
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
      description: Fehlermeldung, Protokoll oder Screenshot ergänzen, falls vorhanden. Nur Bilder und Projekte teilen, die öffentlich werden dürfen.
    validations:
      required: true
